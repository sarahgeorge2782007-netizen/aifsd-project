<!DOCTYPE html>
<html>
<head>
    <title>Library Membership Form</title>
</head>
<style>
form {
                    background-color: rgb(103, 170, 192);
                    padding: 20px;
                    width: 400px;
                    margin: auto;

                }
   </style>             
<body>

    <h2>Library Membership Form</h2>

    <form>

        <label>Student Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Register Number:</label>
        <input type="text" name="regno">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Course:</label>
        <select>
            <option>CSE</option>
            <option>ISE</option>
            <option>AI & ML</option>
            <option>Data Science</option>
        </select>
        <br><br>

        <label>Preferred Book Category:</label>
        <br>
        <input type="checkbox"> Fiction
        <input type="checkbox"> Science
        <input type="checkbox"> Technology
        <input type="checkbox"> Biography
        <br><br>

        <label>Membership Start Date:</label>
        <input type="date">
        <br><br>

        <label>Address:</label>
        <br>
        <textarea rows="4" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
